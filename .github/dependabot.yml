version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/pheno-compose-driver"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "cargo"
    directory: "/bindings/rust-ffi"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      gomod:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/tests/playwright"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5
