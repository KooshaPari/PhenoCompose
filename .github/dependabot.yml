version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/pheno-compose-driver"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: "cargo"
    directory: "/bindings/rust-ffi"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5
# gomod watcher at / removed 2026-06-08 — PhenoCompose no longer carries
# a Go module; the canonical Go tree lives in KooshaPari/nanovms.
# npm watchers at / and /tests/playwright removed 2026-06-08 — the
# Playwright harness moved to nanovms/tests/playwright as part of the
# PhenoCompose ↔ nanovms consolidation. See CONSOLIDATION.md.
