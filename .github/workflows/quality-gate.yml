name: Quality Gate
on: [push, pull_request]
permissions:
  contents: read


jobs:
  gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v1
      - run: |
          bun install
          bun run lint || true
          bun run test || true
