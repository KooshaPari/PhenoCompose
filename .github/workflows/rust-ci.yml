name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            . -> target
            bindings/rust-ffi -> bindings/rust-ffi/target
            pheno-compose-driver -> pheno-compose-driver/target
            crates/pheno-config -> crates/pheno-config/target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets --locked

  test:
    name: cargo test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            . -> target
            bindings/rust-ffi -> bindings/rust-ffi/target
            pheno-compose-driver -> pheno-compose-driver/target
            crates/pheno-config -> crates/pheno-config/target

      - name: cargo test (workspace)
        run: cargo test --workspace --all-features --locked

  lint:
    name: cargo clippy (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            . -> target
            bindings/rust-ffi -> bindings/rust-ffi/target
            pheno-compose-driver -> pheno-compose-driver/target
            crates/pheno-config -> crates/pheno-config/target

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            . -> target
            bindings/rust-ffi -> bindings/rust-ffi/target
            pheno-compose-driver -> pheno-compose-driver/target
            crates/pheno-config -> crates/pheno-config/target

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version "0.20.2"

      - name: cargo deny check
        run: cargo deny check
