name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier-1 enforcement gates (PR) ──────────────────────────────────
  tier1-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ── 1. LICENSE check (Apache-2.0 OR MIT) ────────────────────────
      - name: Check LICENSE exists (Apache-2.0 OR MIT)
        run: |
          if [ -f LICENSE ] || [ -f LICENSE-APACHE ] || [ -f LICENSE-MIT ]; then
            echo "✓ LICENSE file(s) found"
          else
            echo "✗ No LICENSE file found – expected Apache-2.0 OR MIT"
            exit 1
          fi

      # ── 2. CHANGELOG check ──────────────────────────────────────────
      - name: Check CHANGELOG updated
        run: |
          if git log -1 --name-only --format="" | grep -q "^CHANGELOG.md$"; then
            echo "✓ CHANGELOG.md modified in latest commit"
          elif [ -f CHANGELOG.md ]; then
            echo "✓ CHANGELOG.md exists (non-strict gate)"
          else
            echo "✗ CHANGELOG.md missing"
            exit 1
          fi

      # ── 3. Security scan ────────────────────────────────────────────
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@e74404a774dac2767b173c420393a27dff012fab
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # ── 4. npm audit (JS packages) ──────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install Node dependencies when manifests exist
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r manifest; do
            found=1
            npm install --prefix "$(dirname "$manifest")" --ignore-scripts --no-audit --no-fund
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo 'No Node package manifests found; skipping npm dependency install.'
          fi
      - name: npm audit
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r manifest; do
            found=1
            package_dir=$(dirname "$manifest")
            npm audit --prefix "$package_dir" --audit-level=high || echo "::warning::npm audit found vulnerabilities in $package_dir"
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo 'No Node package manifests found; skipping npm audit.'
          fi

      # ── 5. cargo audit (Rust crates) ────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings 2>/dev/null || cargo audit

      # ── 6. SBOM (CycloneDX) ────────────────────────────────────────
      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@e538da6f6cb877d250a673b98633eb7f29259a82
        with:
          path: ./packages/integration
          output: ./sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ./sbom.cyclonedx.json
          retention-days: 90

  # ── Test (existing) ────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }
      - name: Install and test Node packages when manifests exist
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r manifest; do
            found=1
            package_dir=$(dirname "$manifest")
            npm install --prefix "$package_dir" --ignore-scripts --no-audit --no-fund
            npm run --prefix "$package_dir" build 2>/dev/null || echo "no build in $package_dir"
            npm test --prefix "$package_dir" 2>/dev/null || npm run --prefix "$package_dir" test:unit 2>/dev/null || echo "no tests in $package_dir"
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo 'No Node package manifests found; skipping Node tests.'
          fi
