name: secret-scan

on:
  push:
    branches: [main, master, develop, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks (L47 secret scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload SARIF (on failure)
        if: failure()
        uses: github/codeql-action/upload-sarif@8c6e48dbe051ceb3015c19554831af1b43275f46  # yamllint disable-line rule:line-length
        with:
          sarif_file: results.sarif
          category: gitleaks

  trufflehog:
    name: trufflehog (L47 second-layer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: trufflehog (filesystem + history)
        uses: trufflesecurity/trufflehog@67d0241853a5a8e55e2166868287c1f148176939
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
