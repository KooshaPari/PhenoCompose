repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        entry: npm exec -- prettier --check
        language: system
        files: \.(md|json|ya?ml|ts|tsx|mts)$

      - id: eslint
        name: eslint
        entry: npm exec -- eslint --max-warnings=0
        language: system
        files: \.(ts|tsx|mts)$

      - id: tsc
        name: tsc --noEmit
        entry: npm exec -- tsc --noEmit
        language: system
        pass_filenames: false

      - id: vitest
        name: vitest run
        entry: npm exec -- vitest run --passWithNoTests
        language: system
        pass_filenames: false

      - id: markdownlint
        name: markdownlint-cli2
        entry: npm exec -- markdownlint-cli2
        language: system
        files: \.md$
