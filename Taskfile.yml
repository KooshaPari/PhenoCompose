version: "3"

vars:
  HAS_GO:
    sh: 'test -f go.mod && echo 1 || echo 0'
  HAS_RUST:
    sh: 'cargo metadata --manifest-path pheno-compose-driver/Cargo.toml --no-deps --format-version 1 >/dev/null 2>&1 && echo 1 || echo 0'
  HAS_RUST_FFI:
    sh: 'cargo metadata --manifest-path bindings/rust-ffi/Cargo.toml --no-deps --format-version 1 >/dev/null 2>&1 && echo 1 || echo 0'
  HAS_ROOT_PACKAGE:
    sh: 'test -f package.json && echo 1 || echo 0'
  HAS_DOCS_BUILD:
    sh: |
      node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json", "utf8")); process.exit(p.scripts && p.scripts["docs:build"] ? 0 : 1)' >/dev/null 2>&1 && echo 1 || echo 0
  HAS_PLAYWRIGHT:
    sh: 'test -f tests/playwright/package.json && echo 1 || echo 0'
  HAS_PLAYWRIGHT_BUILD:
    sh: |
      node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("tests/playwright/package.json", "utf8")); process.exit(p.scripts && p.scripts.build ? 0 : 1)' >/dev/null 2>&1 && echo 1 || echo 0
  HAS_PLAYWRIGHT_TEST:
    sh: |
      node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("tests/playwright/package.json", "utf8")); process.exit(p.scripts && p.scripts.test ? 0 : 1)' >/dev/null 2>&1 && echo 1 || echo 0
  JS_RUNNER:
    sh: 'command -v bun >/dev/null 2>&1 && echo bun || echo npm'

tasks:
  default:
    desc: List available common tasks
    cmds:
      - task --list

  build:
    desc: Build repo components detected from manifests
    cmds:
      - cmd: |
          set -eu

          if [ "{{.HAS_GO}}" = "1" ]; then
            go build ./cmd/... ./internal/...
          fi

          if [ "{{.HAS_RUST}}" = "1" ]; then
            cargo build --manifest-path pheno-compose-driver/Cargo.toml
          fi

          if [ "{{.HAS_RUST_FFI}}" = "1" ]; then
            cargo build --manifest-path bindings/rust-ffi/Cargo.toml
          fi

          if [ "{{.HAS_DOCS_BUILD}}" = "1" ]; then
            {{.JS_RUNNER}} run docs:build
          fi

          if [ "{{.HAS_PLAYWRIGHT}}" = "1" ] && [ "{{.HAS_PLAYWRIGHT_BUILD}}" = "1" ]; then
            cd tests/playwright
            {{.JS_RUNNER}} run build
          fi

  test:
    desc: Run repo tests for detected components
    cmds:
      - cmd: |
          set -eu

          if [ "{{.HAS_GO}}" = "1" ]; then
            go test ./cmd/... ./internal/...
          fi

          if [ "{{.HAS_RUST}}" = "1" ]; then
            cargo test --manifest-path pheno-compose-driver/Cargo.toml
          fi

          if [ "{{.HAS_RUST_FFI}}" = "1" ]; then
            cargo test --manifest-path bindings/rust-ffi/Cargo.toml
          fi

          if [ "{{.HAS_PLAYWRIGHT}}" = "1" ] && [ "{{.HAS_PLAYWRIGHT_TEST}}" = "1" ]; then
            cd tests/playwright
            {{.JS_RUNNER}} run test
          fi

  lint:
    desc: Lint repo components detected from manifests
    cmds:
      - cmd: |
          set -eu

          if [ "{{.HAS_GO}}" = "1" ]; then
            if command -v golangci-lint >/dev/null 2>&1; then
              golangci-lint run ./cmd/... ./internal/...
            else
              go vet ./cmd/... ./internal/...
            fi
          fi

          if [ "{{.HAS_RUST}}" = "1" ]; then
            cargo fmt --manifest-path pheno-compose-driver/Cargo.toml --all --check
            cargo clippy --manifest-path pheno-compose-driver/Cargo.toml --all-targets --all-features -- -D warnings
          fi

          if [ "{{.HAS_RUST_FFI}}" = "1" ]; then
            cargo fmt --manifest-path bindings/rust-ffi/Cargo.toml --all --check
            cargo clippy --manifest-path bindings/rust-ffi/Cargo.toml --all-targets --all-features -- -D warnings
          fi

          if [ "{{.HAS_DOCS_BUILD}}" = "1" ]; then
            {{.JS_RUNNER}} run docs:build
          fi

  clean:
    desc: Remove generated artifacts for detected components
    cmds:
      - cmd: |
          set -eu

          if [ "{{.HAS_GO}}" = "1" ]; then
            go clean ./cmd/... ./internal/...
          fi

          if [ "{{.HAS_RUST}}" = "1" ]; then
            rm -rf pheno-compose-driver/target
          fi

          if [ "{{.HAS_RUST_FFI}}" = "1" ]; then
            rm -rf bindings/rust-ffi/target
          fi

          if [ "{{.HAS_ROOT_PACKAGE}}" = "1" ]; then
            rm -rf docs/.vitepress/dist
          fi

          if [ "{{.HAS_PLAYWRIGHT}}" = "1" ]; then
            rm -rf tests/playwright/dist tests/playwright/node_modules/.cache
          fi
