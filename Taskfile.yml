version: "3"

tasks:
  build:
    desc: Build detected Go, Rust, TypeScript, and VitePress components
    cmds:
      - cmd: |
          set -eu

          if [ -f go.mod ]; then
            go build ./cmd/... ./internal/... ./bindings/...
          fi

          for manifest in $(find . -name Cargo.toml -not -path "./target/*" | sort); do
            [ -n "$manifest" ] || continue
            cargo build --manifest-path "$manifest"
          done

          if [ -f package.json ]; then
            if command -v bun >/dev/null 2>&1; then
              bun run docs:build
            else
              npm run docs:build
            fi
          fi

          if [ -f tests/playwright/package.json ]; then
            npm --prefix tests/playwright run build
          fi

  test:
    desc: Run tests for detected Go, Rust, and Playwright components
    cmds:
      - cmd: |
          set -eu

          if [ -f go.mod ]; then
            go test ./cmd/... ./internal/... ./bindings/...
          fi

          for manifest in $(find . -name Cargo.toml -not -path "./target/*" | sort); do
            [ -n "$manifest" ] || continue
            cargo test --manifest-path "$manifest"
          done

          if [ -f tests/playwright/package.json ]; then
            npm --prefix tests/playwright test
          fi

  lint:
    desc: Lint detected Go, Rust, TypeScript, and docs components
    cmds:
      - cmd: |
          set -eu

          if [ -f go.mod ]; then
            if command -v golangci-lint >/dev/null 2>&1; then
              golangci-lint run ./cmd/... ./internal/... ./bindings/...
            else
              go vet ./cmd/... ./internal/... ./bindings/...
            fi
          fi

          for manifest in $(find . -name Cargo.toml -not -path "./target/*" | sort); do
            [ -n "$manifest" ] || continue
            cargo fmt --manifest-path "$manifest" --all --check
            cargo clippy --manifest-path "$manifest" --all-targets --all-features -- -D warnings
          done

          if [ -f package.json ]; then
            if command -v bun >/dev/null 2>&1; then
              bun run docs:build
            else
              npm run docs:build
            fi
          fi

          if [ -f tests/playwright/package.json ]; then
            npm --prefix tests/playwright run build
          fi

  clean:
    desc: Remove generated artifacts and caches for detected components
    cmds:
      - cmd: |
          set -eu

          if [ -f go.mod ]; then
            go clean -cache -testcache
          fi

          for manifest in $(find . -name Cargo.toml -not -path "./target/*" | sort); do
            [ -n "$manifest" ] || continue
            cargo clean --manifest-path "$manifest"
          done

          if [ -f package.json ]; then
            rm -rf docs/.vitepress/dist
          fi

          if [ -f tests/playwright/package.json ]; then
            rm -rf tests/playwright/dist tests/playwright/node_modules/.cache
          fi
