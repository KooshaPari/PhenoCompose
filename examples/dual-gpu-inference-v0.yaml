api_version: phenocompose.dev/v0
kind: Composition
metadata:
  name: dual-gpu-inference
  labels:
    purpose: day-4-service-graph
    stack: sglang-llama-pheno-serve
environment:
  platform: windows_wsl
  toolkit:
    name: cuda
    version: "13.0"
  variables:
    PHENO_ENV: inference-lab
    PHENO_SERVE_PORT: "21080"
runtime:
  provider: podman
  capability: runtime.podman
  wsl_distribution: Ubuntu-24.04
  portage_compatibility:
    external_engine_token: docker
    effective_engine: podman
providers:
  gpu-discovery:
    capability: resources.gpu.discovery
    status: available
    implementation: hwledger
  service-lifecycle:
    capability: runtime.service_lifecycle
    status: placeholder
    implementation: nanovms-podman-bridge
services:
  sglang-primary:
    image: lmsysorg/sglang:latest
    depends_on: []
    command:
      - python3
      - -m
      - sglang.launch_server
    environment:
      CUDA_VERSION: "13.0"
      SGLANG_GPU_UUID: GPU-8d337a84-43de-158d-7526-7175288a6064
    resources:
      cpu_millis: 8000
      memory_bytes: 21474836480
      gpu:
        vendor: nvidia
        uuids:
          - GPU-8d337a84-43de-158d-7526-7175288a6064
    health_check:
      command:
        - /bin/sh
        - -c
        - curl -sf http://127.0.0.1:30000/health
      interval_seconds: 15
      timeout_seconds: 5
      retries: 5
  llama-primary:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    depends_on: []
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
    environment:
      CUDA_VERSION: "12.4"
      LLAMA_CUDA12_TRANSITIONAL: "true"
    resources:
      cpu_millis: 4000
      memory_bytes: 16106127360
      gpu:
        vendor: nvidia
        uuids:
          - GPU-8d337a84-43de-158d-7526-7175288a6064
    health_check:
      command:
        - /bin/sh
        - -c
        - curl -sf http://127.0.0.1:8081/health
      interval_seconds: 10
      timeout_seconds: 3
      retries: 5
  llama-helper:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    depends_on: []
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8082"
    environment:
      CUDA_VERSION: "12.4"
      LLAMA_PASCAL_HELPER: "true"
    resources:
      cpu_millis: 2000
      memory_bytes: 8589934592
      gpu:
        vendor: nvidia
        uuids:
          - GPU-e1e28703-34bd-e46b-6dc1-d7c39fa5612c
    health_check:
      command:
        - /bin/sh
        - -c
        - curl -sf http://127.0.0.1:8082/health
      interval_seconds: 10
      timeout_seconds: 3
      retries: 5
  pheno-serve:
    image: localhost/pheno-serve:dev
    depends_on:
      - sglang-primary
      - llama-primary
      - llama-helper
    command:
      - pheno-serve
      - --config
      - /etc/pheno/serve.yaml
    environment:
      PHENO_SERVE_AGGREGATOR: "true"
    resources:
      cpu_millis: 1000
      memory_bytes: 2147483648
    health_check:
      command:
        - /bin/sh
        - -c
        - curl -sf http://127.0.0.1:21080/healthz
      interval_seconds: 10
      timeout_seconds: 3
      retries: 5
actions:
  probe-stack:
    service: pheno-serve
    command:
      - /usr/bin/env
    output_root: jobs/inference-probes
teardown:
  order:
    - pheno-serve
    - llama-helper
    - llama-primary
    - sglang-primary
  remove_volumes: false
provenance:
  required: true
  format: phenocompose_v0
  include:
    - manifest_sha256
    - container_ids
