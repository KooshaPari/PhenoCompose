[package]
name = "nvms-ffi"
version = "0.1.0"
edition = "2021"
description = "Rust FFI bindings to NVMS Go Core"
authors = ["Phenotype"]
license = "Apache-2.0"
repository = "https://github.com/KooshaPari/nanovms"

[dependencies]

[build-dependencies]
bindgen = "0.68"

[target.'cfg(not(test))'.dependencies]
# Only link when not in test mode
nvms-core-sys = { path = "../nvms-core-sys" }

[features]
default = []
cuda = []  # Enable CUDA support for ML workloads

[lib]
name = "nvms_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]
