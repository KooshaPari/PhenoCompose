coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: true
  hide_project_coverage: false

ignore:
  - "docs/**"
  - ".github/**"
  - "scripts/**"
  - "examples/**"

flags:
  vitest:
    paths:
      - tests/
    carryforward: true
