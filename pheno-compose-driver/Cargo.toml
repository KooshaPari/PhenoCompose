[package]
name = "pheno-compose-driver"
version = "0.1.0"
edition = "2021"
description = "PhenoCompose NVMS Driver - Rust interface to NVMS 3-tier isolation"
authors = ["Phenotype"]
license = "Apache-2.0"
repository = "https://github.com/KooshaPari/nanovms"

[dependencies]
nvms-ffi = { path = "../bindings/rust-ffi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
nvms = ["nvms-ffi"]  # Enable NVMS backend
mock = []            # Use mock backend for testing

[lib]
name = "pheno_compose_driver"
crate-type = ["lib", "staticlib", "cdylib"]
