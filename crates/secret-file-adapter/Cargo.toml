[workspace]

[package]
name = "phenocompose-secret-file-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "File-backed `SecretStore` adapter for the `phenocompose-port-secret` port. Persists secrets as JSON on local disk and supports optional atomic write + mtime-based concurrent-update detection."
publish = false
repository = "https://github.com/KooshaPari/PhenoCompose"
documentation = "https://docs.rs/phenocompose-secret-file-adapter"
keywords = ["phenotype", "pheno-compose", "adapter", "secret", "file"]
categories = ["development-tools", "filesystem"]
authors = ["kooshapari"]

[lib]
path = "src/lib.rs"

[dependencies]
phenocompose-port-secret = { path = "../port-secret" }
phenocompose-port-types = { path = "../port-types", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
