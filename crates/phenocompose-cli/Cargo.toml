[workspace]

[package]
name = "phenocompose-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoCompose"
description = "Truthful composition planner and Podman runtime CLI"
publish = false

[[bin]]
name = "pheno-compose"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
phenocompose-port-composer = { path = "../port-composer" }
phenocompose-port-publisher = { path = "../port-publisher" }
phenocompose-port-runtime = { path = "../port-runtime" }
phenocompose-port-types = { path = "../port-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.15"
