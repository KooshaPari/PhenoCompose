# PhenoCompose — cargo-deny configuration
#
# Run:   cargo deny check
# Docs:  https://embarkstudios.github.io/cargo-deny/

[advisories]
# Path to the advisory database
db-path = "~/.cargo/advisory-dbs"
# URL of the advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignored advisory IDs (add as needed)
# ignore = ["RUSTSEC-2023-0001"]

# If a crate is unmainlined/unsound we can ignore it here.
# This is a last resort — prefer to update or replace the crate.
# ignore = []

[licenses]
# The license we want our crates to be licensed under
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]
# Denied, but not a hard error for now — just warn
unlicensed = "deny"
# Confidence threshold for license detection (0.0 — 1.0)
confidence-threshold = 0.8
# Allow exceptions for specific crate+license combos
# exceptions = []
# Skip checking license for these crates
# skip = []

[bans]
# Which crates are banned
# deny = []
# Which crates to skip duplicate-detection for
# skip-tree = []
# Multiple versions of the same crate — only the first match in each list is allowed
multiple-versions = "deny"
# Highlight duplicate crates during `cargo deny check bans`
highlight = true
# Skip these specific crate+version combos when checking for duplicates
# skip = [
#     # Example: OpenSSL-sys has many versions; skip the "older" one
#     # { name = "openssl-sys", version = "0.9" },
# ]

[sources]
# Allowed sources of crates
allow-git = []
# Deny unknown sources (crates.io is allowed by default)
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Deny specific sources
# deny = []

# ──────────────────────────────────────────────────────────────────────────
#  SKIP TREE — transitive deps that are known to pull in duplicate versions
#  Add entries here when `cargo deny check bans` reports a false positive
#  due to a crate that is not actually a conflict (e.g., proc-macro vs lib).
# ──────────────────────────────────────────────────────────────────────────
# [bans.skip-tree]
# Example:
# "syn" = [
#     { name = "proc-macro2", version = "1" },
# ]
