apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: port-resolution-slow
  labels:
    severity: warning
spec:
  groups:
  - name: phenocompose
    rules:
    - alert: port-resolution-slow
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
      for: 5m
      annotations:
        summary: "PhenoCompose port-resolution-slow firing"
        description: "Error rate > 10% for 5m"
