apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: compose-build-high-error-rate
  labels:
    severity: warning
spec:
  groups:
  - name: phenocompose
    rules:
    - alert: compose-build-high-error-rate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
      for: 5m
      annotations:
        summary: "PhenoCompose compose-build-high-error-rate firing"
        description: "Error rate > 10% for 5m"
