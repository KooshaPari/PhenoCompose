---
# Trunk.io — plugin and repository checks.
# Schema follows Trunk 0.1 (the previous map-shaped file was rejected by
# Trunk 1.22.2; linter configuration belongs under `lint`).

version: 0.1
cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.6.6
      uri: https://github.com/trunk-io/plugins

lint:
  enabled:
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - ruff
    - shellcheck
    - yamllint
  definitions:
    - name: actionlint
      direct_configs:
        - .github/workflows/*.yml
    - name: black
      direct_configs:
        - pyproject.toml
        - ruff.toml
    - name: clippy
      direct_configs:
        - clippy.toml
    - name: eslint
      direct_configs:
        - .eslintrc.*
        - eslint.config.*
    - name: golangci-lint
      direct_configs:
        - .golangci.yml
        - .golangci.yaml
    - name: mypy
      direct_configs:
        - pyproject.toml
    - name: ruff
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: prettier
      direct_configs:
        - .prettierrc
        - prettier.config.*
    - name: rustfmt
      direct_configs:
        - rustfmt.toml
  ignore:
    - linters: [ALL]
      paths:
        - .git/
        - "*.lock"
