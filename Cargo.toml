[workspace]
resolver = "2"
# Note: crates/port-types, port-runtime, port-publisher, port-composer each
# declare themselves as single-crate workspaces and are intentionally NOT
# members of this parent workspace. They are consumed via path deps by
# their siblings only. crates/phenotype-* (top-level) and ports/ are
# likewise standalone.
members = [
    "bindings/rust-ffi",     # nvms-ffi
    "pheno-compose-driver",  # pheno-compose-driver
    "crates/apple-container-adapter",
    "crates/pheno-config",   # pheno-config
    "crates/wslc-adapter",
    "windows/scm-service",   # pheno-scm-service (PR-B scaffold; L123/L130)
    "mobile/macos-shell",    # pheno-macos-shell (PR-A scaffold; L121/L130)
    "mobile/android-monitor",# pheno-android-monitor (PR-A scaffold; L125/L130)
    "tools/update",          # P2 lift (L34)
    "tools/release-notes",   # P2 lift (L23)
    "crates/i18n",           # P2 lift (L17)
    "tools/fuzz",            # P2 lift (L22)
]
exclude = [
    "crates/port-composer",
    "crates/port-publisher",
    "crates/port-runtime",
    "crates/port-secret",
    "crates/port-types",
]


[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoCompose"
description = "PhenoCompose - Phenotype deployment composition (NVMS driver + Rust FFI bindings)"
authors = ["kooshapari"]
publish = false

[workspace.dependencies]
# Core
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bindgen = "0.68"
figment = { version = "0.10", features = ["toml", "env"] }
